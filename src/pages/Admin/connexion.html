<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestoFacile - Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

</head>
<body class="min-h-screen bg-gradient-to-br from-blue-100 via-white to-blue-100 flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2 font-['Pacifico']">RestoFacile</h1>
            <p class="text-gray-600">Administration du restaurant scolaire</p>
        </div>
        <!-- Carte de connexion -->
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
            <div class="text-center mb-6">
                <h2 class="text-2xl font-semibold text-gray-800 mb-2">Connexion</h2>
            </div>
            <form class="space-y-6">
                <!-- Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2" for="email">Adresse email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <div class="w-5 h-5 flex items-center justify-center text-gray-400">
                                <i class="ri-mail-line"></i>
                            </div>
                        </div>
                        <input id="email" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" placeholder="votre@email.fr" required="" type="email" value="" name="email">
                    </div>
                </div>

                <!-- Mot de passe -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Mot de passe</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <div class="w-5 h-5 flex items-center justify-center text-gray-400">
                                <i class="ri-lock-line"></i>
                            </div>
                        </div>
                        <input id="password" class="w-full pl-10 pr-10 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors" placeholder="••••••••" required="" type="password" value="" name="password">
                        <button type="button" class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer">
                            <div class="w-5 h-5 flex items-center justify-center text-gray-400 hover:text-gray-600">
                                <i class="ri-eye-line"></i>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- Options -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" type="checkbox" name="rememberMe">
                        <span class="ml-2 text-sm text-gray-700">Se souvenir de moi</span>
                    </label>
                    <a class="text-sm text-blue-600 hover:text-blue-800 transition-colors" href="/preview/e91be1b2-617c-4b91-a165-5d259e145e36/1716467/forgot-password">Mot de passe oublié ?</a>
                </div>

                <!-- Bouton -->
                <button type="submit" class="w-full bg-blue-600 text-white py-3 px-4 rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-colors font-medium whitespace-nowrap cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
                    <a href="./dashboard.html" class="block w-full text-center">
                        Se connecter
                    </a>
                </button>
            </form>
        </div>

        <!-- Lien support -->
        <div class="text-center mt-6">
            <p class="text-sm text-gray-600">
                Besoin d'aide ?
                <a class="text-blue-600 hover:text-blue-800 transition-colors" href="/preview/e91be1b2-617c-4b91-a165-5d259e145e36/1716467/support">Contactez le support</a>
            </p>
        </div>
    </div>
</body>
</html>
